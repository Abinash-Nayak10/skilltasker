<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="/images/logo.png" types="/images/png">

  <link rel="stylesheet" href="/css/join.css">
</head>
<body>

  <div class="container">
    <fieldset class="p-4 border bg-white">
      <legend class="fw-semibold text-center">Application Form</legend>

      <form action="https://www.google.com" method="post">

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" id="name" class="form-control" placeholder="Type Your Name" required minlength="8" maxlength="15">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="mail" class="form-label">Email</label>
          <input type="email" id="mail" class="form-control" placeholder="Type Your Email">
        </div>

        <!-- Mobile -->
        <div class="mb-3">
          <label for="mob" class="form-label">Mobile Number</label>
          <input type="tel" id="mob" class="form-control" placeholder="Type Your Mobile Number" pattern="[0-9]{10}">
        </div>

        <!-- Gender -->
        <div class="mb-3">
          <label for="gender" class="form-label">Gender</label>
          <select id="gender" class="form-select">
            <option selected disabled>Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <!-- Qualification -->
        <div class="mb-3">
          <label for="qual" class="form-label">Qualification</label>
          <select id="qual" class="form-select">
            <option selected disabled>Select</option>
            <option value="b.tech">B. Tech</option>
            <option value="bsc">BSC</option>
            <option value="m.tech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="mca">MCA</option>
          </select>
        </div>

        <!-- Resume -->
        <div class="mb-3">
          <label for="file" class="form-label">Upload Resume</label>
          <input type="file" id="file" class="form-control">
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-4 justify-content-center">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-primary">Reset</button>
        </div>

      </form>
    </fieldset>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
