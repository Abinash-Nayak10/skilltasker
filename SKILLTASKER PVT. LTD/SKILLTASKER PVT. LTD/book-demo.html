<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book A Demo</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="shortcut icon" href="/images/logo.png" type="/image/png">

  <link rel="stylesheet" href="/css/book a demo.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top gap-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="/images/logo.png" alt="Logo" onerror="this.style.display='none'" height="60" width="80" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="aboutus.html">About</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="servicesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Services
            </a>
            <ul class="dropdown-menu" aria-labelledby="servicesDropdown">
              <li><a class="dropdown-item" href="training.html">Training</a></li>
              <li><a class="dropdown-item" href="development.html">Development</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="career.html">Career</a></li>
          <li class="nav-item">
            <a class="nav-link active" style="background: linear-gradient(to right, #f9335e, #e73ee7); border-radius: 20px;" href="book-demo.html">Book A Demo!</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <div class="contact-bg">
    <div class="contact-card" data-aos="zoom-in" data-aos-duration="1000">
      <h2>Book A Demo</h2>

      <!-- Success message -->
      <div id="successMsg" class="alert alert-success text-center d-none" role="alert">
        ✅ Your message has been submitted successfully!
      </div>

      <form id="contactForm">
        <div class="mb-3">
          <label>Your Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label>Email Address</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label>Phone Number</label>
          <input type="number" class="form-control" id="phone" pattern="[0-9]*" inputmode="numeric" required>
        </div>
        <div class="mb-3">
          <label>Message</label>
          <textarea rows="4" class="form-control" id="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-custom w-100">Send</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-bottom">
    <p class="mb-0">All Rights Reserved SkillTasker Pvt. Ltd. @2025</p>
  </footer>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
